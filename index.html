<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لعبة الألغاز - منصّة جزي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrapper">
    <div class="ui-panel">
      <h1>لعبة الألغاز</h1>
      <p class="subtitle">إصدار أوفلاين - مستوحاة من سوبر ماريو</p>

      <div class="info-box">
        <p><strong>التحكم:</strong></p>
        <ul>
          <li>⬅️ ➡️ : التحرك يمين ويسار</li>
          <li>⭡ أو W أو Space : قفز</li>
          <li>R : إعادة المرحلة</li>
        </ul>
        <p><strong>الفكرة:</strong> أوصل للباب <span class="tile exit"></span> بعد حل لغز المرحلة.</p>
      </div>

      <div class="status">
        <p>المرحلة: <span id="level-number">1</span> / 7</p>
        <p>المحاولات: <span id="deaths-count">0</span></p>
        <p id="message"></p>
      </div>

      <button id="btn-next" class="btn" style="display:none;">المرحلة التالية ⏭️</button>
      <button id="btn-restart" class="btn">إعادة المرحلة 🔁</button>
    </div>

    <div class="canvas-panel">
      <canvas id="game" width="960" height="540"></canvas>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
